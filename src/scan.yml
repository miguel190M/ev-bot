name: EV Scan

on:
  schedule:
    # Backup only - cron-job.org triggers the real 30-min runs.
    - cron: "23 */3 * * *"
  workflow_dispatch: {}

concurrency:
  group: ev-scan
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Run EV scan
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EV_THRESHOLD_SLOPE: "0.02"
          EV_THRESHOLD_INTERCEPT: "-0.01"
          MIN_BOOKS: "3"
          SCAN_WINDOW_HOURS: "3"
          FAR_WINDOW_HOURS: "12"
          FAR_CHECK_INTERVAL_HOURS: "4"
        run: python main.py

      - name: Commit updated state
        run: |
          git config user.name "ev-bot"
          git config user.email "ev-bot@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "Update EV state [skip ci]"
          git push
